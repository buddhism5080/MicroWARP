name: Build and Publish MicroWARP

# ==========================================
# 触发条件：
# 1. 发布 Release 版本时自动构建 (打标签)
# 2. 手动点击触发按钮 (方便随时测试打包)
# ==========================================
on:
  push:
    branches:
      - '**'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner != 'ccbkkb' && format('{0}/microwarp-fork-{1}', github.repository_owner, github.event.repository.id) || github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 1. 如果是打 Tag 发版，生成严格的版本号标签 (如 1.0.0)
            type=semver,pattern={{version}}

            # 2. 任何分支推送都生成对应分支标签，方便在 fork 上直接测试
            type=ref,event=branch

            # 3. 主分支或 Release 事件额外发布 latest 标签
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'release' }}

            # 4. 始终附带 commit sha 标签，方便精确回滚
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
